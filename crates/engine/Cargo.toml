[package]
name = "engine"
version = "4.1.0"
edition = "2024"

[features]
tuning = []

[dependencies]
chess = { workspace = true }
anyhow = { workspace = true }
uci-parser = { workspace = true, features = [
    "parse-go-perft",
    "parse-position-kiwipete",
    "types",
    "clamp-negatives",
] }
arrayvec = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
insta = { workspace = true, features = ["yaml"] }
itertools = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "eval"
harness = false
