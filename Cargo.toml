[workspace]
members = ["chess", "engine", "engine-cli", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
authors = ["Paul Tsouchlos <developer.paul.123@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/ptsouchlos/byte-knight"

[workspace.dependencies]
anyhow = "1.0.102"
arrayvec = "0.7.6"
chess = { path = "chess" }
clap = "4.5.60"
colored = "3.1.1"
console = "0.16.2"
criterion = "0.8"
csv = "1.4.0"
engine = { path = "engine" }
indicatif = "0.18.4"
itertools = "0.14.0"
rand = "0.10.0"
rayon = "1.11.0"
serde = "1.0.228"
textplots = "0.8.7"
thiserror = "2.0.18"
uci-parser = "1.1.0"

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
debug = false
rpath = false
debug-assertions = false
incremental = false
overflow-checks = false
