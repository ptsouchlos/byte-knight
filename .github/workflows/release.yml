name: Build release binaries

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: false
        default: "9.99.99"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            toolchain: nightly
            target: aarch64-apple-darwin
          - os: windows-latest
            toolchain: stable
            target: x86_64-pc-windows-msvc
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7

      - uses: ptsouchlos/infra/.github/actions/setup-rust@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ""
          targets: ${{ matrix.target }}

      - uses: ptsouchlos/infra/.github/actions/cargo-release@v1
        id: release
        with:
          target: ${{ matrix.target }}
          bin: byte-knight
          name: byte-knight-${{ env.VERSION }}-${{ matrix.target }}
          archive: none
          release: ${{ github.event_name == 'push' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: byte-knight-${{ matrix.target }}${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          path: ${{ steps.release.outputs.asset }}
          retention-days: 1
